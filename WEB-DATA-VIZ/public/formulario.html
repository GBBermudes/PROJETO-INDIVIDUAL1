<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formulario.css">
    <title>Document</title>
</head>

<body>
    <div class="header"></div>
    <div class="box-pai">
        <div class="card-formulario">
            <p>Qual o tipo de pescaria que você mais gosta?</p>
            <select name="tipo-pescaria" id="ipt_tipo_pescaria">
                <option selected disabled value="">Selecione uma modalidade</option>
                <option value="esportiva">Pesca Esportiva (pesque e solte)</option>
                <option value="mar">Pesca no Mar</option>
                <option value="canal">Pesca no Canal</option>
                <option value="praia">Pesca na praia</option>
            </select><br>
            <p>Como você prefere aproveitar uma pescaria?</p>
            <select name="como-aproveitar" id="ipt_como_aproveitar">
                <option selected disabled value="">Selecione uma opção</option>
                <option value="familiares-amigos">Com familiares e amigos</option>
                <option value="sozinho">Sozinho, aproveitando o silêncio</option>
                <option value="apenas-amigos">Apenas com amigos que também gostam de pescar</option>
                <option value="sem-preferencia">Não tenho preferência, depende da ocasião</option>
            </select><br>
            <p>O que você mais procura em uma pescaria?</p>
            <select name="oque-mais-procura" id="ipt_oque_mais_procura">
                <option selected disabled value="">Selecione uma opção</option>
                <option value="relaxar">Relaxar e fugir da rotina</option>
                <option value="peixe-grande">A emoção de pegar peixe grande</option>
                <option value="bons-momentos">Passar bons momentos com outras pessoas</option>
                <option value="natureza">Estar em contato com a natureza</option>
            </select><br>
            <p>Com que frequência você costuma pescar?</p>
            <select name="frequencia" id="ipt_frequencia">
                <option selected disabled value="">Selecione sua frequência</option>
                <option value="sempre">Sempre que tenho oportunidade</option>
                <option value="finais-semana">Nos finais de semana</option>
                <option value="feriados-ferias">Apenas em feriados e férias</option>
                <option value="raramente">Raramente, mas gostaria de pescar mais</option>
            </select>
            <p>Uma frase que define pescaria para você:</p>
            <textarea name="ipt_frase" id="ipt_frase" rows="5" cols="52"></textarea><br>
            <button onclick="cadastrar()">Que tipo de pescador eu Sou?</button>
        </div>
    </div>
</body>

<script>
    function cadastrar() {
        var tipo_pescaria = ipt_tipo_pescaria.value;
        var como_aproveitar = ipt_como_aproveitar.value;
        var oque_mais_procura = ipt_oque_mais_procura.value;
        var frequencia_pescaria = ipt_frequencia.value;
        var frase = ipt_frase.value;

        if (tipo_pescaria == "" || como_aproveitar == "" || oque_mais_procura == "" || frequencia_pescaria == "" || frase == "") {
            alert("Todas as opções devem estar selecionadas")
        } else {
            fetch("/dadosFormulario/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    tipo_pescaria: tipo_pescaria,
                    como_aproveitar: como_aproveitar,
                    oque_mais_procura: oque_mais_procura,
                    frequencia_pescaria: frequencia_pescaria,
                    frase: frase
                }),
            })
        }
    }
</script>

</html>
