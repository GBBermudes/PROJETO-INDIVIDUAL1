<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboards.css">
    <title>Diário de Pesca do Gabriel | formulario</title>
</head>

<body>
    <div class="pai">
        <aside>
            <div class="titulo-aside">
                <h3>Diário de Samuela</h3>
            </div>
            <div class="menu-aside">
                <p>Registrar</p>
                <p>Dashboard</p>
        </aside>
        <div class="box-dashboard">
            <div class="box-kpi">
            </div>
        </div>
    </div>
</body>

<script>
    fetch("/dadosFormulario/listar") 
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi1 = dados[0]

            document.getElementById("local_mais_costuma_pescar").innerText = kpi1.lugar;
        });
    
    fetch("/dadosFormulario/listarMaiorPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi2 = dados[0]

            document.getElementById("qtd_peixe").innerText = kpi2.qtd_peixe
        })
</script>

</html>
