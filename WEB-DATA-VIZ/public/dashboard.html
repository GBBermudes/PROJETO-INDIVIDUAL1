<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboards.css">
    <title>Diário de Pesca do Gabriel | formulario</title>
</head>

<body>
    <div class="box-pai">
        <div class="navbar">
            <div class="hanken titulo-navbar">
                <h1>Diário de Samuela</h3>
            </div>
            <div class="hanken menu-navbar">
                <a href="formulario.html">
                    <span class="bt-registrar">Registrar</span>
                </a>
                <span class="bt-dashboard">Dashboard</span>
                <span class="bt-sair">Sair</span> 
            </div>
        </div>
        <div class="box-dashboard">
            <div class="box-kpi">
                <div class="kpi kpi-qtd-peixes">
                    <p>Recorde pessoal</p><br>
                    <span id="qtd_peixe"></span>
                    <p class="detalhes"><span id="data_recorde_pessoal"></span>&nbsp; - &nbsp;<span id="local_recorde_pessoal"></span></p>
                </div>
                <div class="kpi kpi-local-favorito">
                    <p>Local mais produtivo:</p>
                    <span id="local_mais_produtivo"></span>
                    <p><span id="media_peixes_local"></span>&nbsp;peixes/pescaria&nbsp;-&nbsp;<span id="qtd_pescarias_local"></span>&nbsp;pescarias</p>
                </div>
                <div class="kpi kpi-modalidade-favorita">
                    <p>Modalidade mais produtiva</p><br>
                    <span id="modalidade_mais_produtiva"></span><br>
                    <p><span id="media_peixes_modalidade"></span>&nbsp;peixes/pescaria -&nbsp;<span id="total_pescarias_modalidade"></span>&nbsp;pescarias</p>
                </div>
            </div>
            <div class="box-grafico"></div>
            <div class="box-historico-registro"></div>
        </div>
    </div>
</body>

<script>
    fetch("/dadosFormulario/listar") 
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi2 = dados[0]

            document.getElementById("local_mais_produtivo").innerText = kpi2.local;
            document.getElementById("media_peixes_local").innerText = kpi2.media_peixes;
            document.getElementById("qtd_pescarias_local").innerText = kpi2.qtd_idas;

        });
    
    fetch("/dadosFormulario/listarMaiorPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi1 = dados[0]

            document.getElementById("qtd_peixe").innerText = kpi1.qtd_peixe;
            document.getElementById("data_recorde_pessoal").innerText = kpi1.Data;
            document.getElementById("local_recorde_pessoal").innerText = kpi1.Local;
        });

    fetch("/dadosFormulario/listarModalidadeProdutiva")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi3 = dados[0]

            document.getElementById("modalidade_mais_produtiva").innerText = kpi3.Modalidade;
            document.getElementById("media_peixes_modalidade").innerText = kpi3.media_peixes;
            document.getElementById("total_pescarias_modalidade").innerText = kpi3.qtd_pescarias;
        })
</script>

</html>
