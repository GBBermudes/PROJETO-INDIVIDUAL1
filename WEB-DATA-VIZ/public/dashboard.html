<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboards.css">
    <title>Diário de Pesca do Gabriel | formulario</title>

</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>
    <div class="box-pai">
        <div class="navbar">
            <div class="hanken titulo-navbar">
                <h1>Diário de Samuela</h3>
            </div>
            <div class="hanken menu-navbar">
                <a href="formulario.html">
                    <span class="bt-registrar">Registrar</span>
                </a>
                <span class="bt-dashboard">Dashboard</span>
                <span class="bt-sair">Sair</span>
            </div>
        </div>
        <div class="box-dashboard">
            <div class="box-kpi">
                <div class="kpi kpi-qtd-peixes">
                    <p>Recorde pessoal</p><br>
                    <span id="qtd_peixe"></span>
                    <p class="detalhes"><span id="data_recorde_pessoal"></span>&nbsp; - &nbsp;<span
                            id="local_recorde_pessoal"></span></p>
                </div>
                <div class="kpi kpi-local-favorito">
                    <p>Local mais produtivo:</p>
                    <span id="local_mais_produtivo"></span>
                    <p><span id="media_peixes_local"></span>&nbsp;peixes/pescaria&nbsp;-&nbsp;<span
                            id="qtd_pescarias_local"></span>&nbsp;pescarias</p>
                </div>
                <div class="kpi kpi-modalidade-favorita">
                    <p>Modalidade mais produtiva</p><br>
                    <span id="modalidade_mais_produtiva"></span><br>
                    <p><span id="media_peixes_modalidade"></span>&nbsp;peixes/pescaria -&nbsp;<span
                            id="total_pescarias_modalidade"></span>&nbsp;pescarias</p>
                </div>
            </div>
            <div class="box-grafico">
                <div class="grafico-1">
                    <p>Quantidade de peixes por mes (2026)</p><button class="bt-meta" onclick="cadastrarMeta()">Definir
                        Meta</button><br>
                    <div class="area-grafico-1">
                        <canvas id="grafico_qtd_peixes"></canvas>
                    </div>
                </div>
                <div class="grafico-2"></div>
            </div>
            <div class="box-historico-registro"></div>
        </div>
    </div>
</body>

<script>
    var lista_meses = []
    var lista_qtd_peixes = []
    var lista_acima = []
    var lista_abaixo = []
    var lista_meta = []
    var meta = 0

    const ctx = document.getElementById('grafico_qtd_peixes');

    fetch("/dadosFormulario/listarMeta")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            meta = Number(dados[0].meta)
            fetch("/dadosFormulario/listarPeixesPorMes")
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (dados) {



                    for (let i = 0; i < dados.length; i++) {
                        lista_meses.push(dados[i].Mes)
                        lista_meta.push(meta)

                        if (dados[i].Total < meta) {
                            lista_abaixo.push(dados[i].Total)
                            lista_acima.push(null)
                        } else {
                            lista_acima.push(dados[i].Total)
                            lista_abaixo.push(null)
                        }

                    }

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: lista_meses,
                            datasets: [{
                                label: 'Abaixo da meta',
                                data: lista_abaixo,
                                backgroundColor: 'red',
                            }, {
                                label: 'Acima da meta',
                                data: lista_acima,
                                backgroundColor: 'green'
                            }, {
                                type: 'line',
                                label: 'Meta',
                                data: lista_meta,
                                borderColor: 'orange',
                                borderDash: [6, 6],
                                pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    stacked: true,
                                    title: {
                                        display: true,
                                        text: 'Quantidade de peixes'
                                    }
                                },
                                x: {
                                    stacked: true,
                                    title: {
                                        display: true,
                                        text: 'Meses'
                                    }
                                }
                            },
                            plugins: {

                            }
                        }
                    })
                })

        })

    fetch("/dadosFormulario/listar")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi2 = dados[0]

            document.getElementById("local_mais_produtivo").innerText = kpi2.local;
            document.getElementById("media_peixes_local").innerText = kpi2.media_peixes;
            document.getElementById("qtd_pescarias_local").innerText = kpi2.qtd_idas;

        });

    fetch("/dadosFormulario/listarMaiorPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi1 = dados[0]

            document.getElementById("qtd_peixe").innerText = kpi1.qtd_peixe;
            document.getElementById("data_recorde_pessoal").innerText = kpi1.Data;
            document.getElementById("local_recorde_pessoal").innerText = kpi1.Local;
        });

    fetch("/dadosFormulario/listarModalidadeProdutiva")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi3 = dados[0]

            document.getElementById("modalidade_mais_produtiva").innerText = kpi3.Modalidade;
            document.getElementById("media_peixes_modalidade").innerText = kpi3.media_peixes;
            document.getElementById("total_pescarias_modalidade").innerText = kpi3.qtd_pescarias;
        })

    function cadastrarMeta() {
        var meta = Number(prompt("Insira sua meta: "))

        if (meta <= 0) {
            alert("Insira uma meta válida")
        } else {

            fetch("/dadosFormulario/cadastrarMeta", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    meta: meta
                }),

            })
            .then(function (resposta) {
                if (resposta) {
                    location.reload()
                } else {
                    alert("Reload Falhou")
                }
            })
        }
    }


</script>

</html>
