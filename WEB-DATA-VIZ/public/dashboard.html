<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/dashboards.css">
    <title>Diário de Pesca do Gabriel | formulario</title>
</head>

<body>
    <div class="box-pai">
        <div class="navbar">
            <div class="hanken titulo-navbar">
                <h1>Diário de Samuela</h3>
            </div>
            <div class="hanken menu-navbar">
                <a href="formulario.html">
                    <span class="bt-registrar">Registrar</span>
                </a>
                <span class="bt-dashboard">Dashboard</span>
                <span class="bt-sair">Sair</span> 
            </div>
        </div>
        <div class="box-dashboard">
            <div class="box-kpi">
                <div class="kpi kpi-qtd-peixes">
                    <p>Quatidade de peixes na ultima pescaria:</p><br>
                    <span id="qtd_peixe">40</span>
                    <p style="color: green;">5 a mais que na anterior</p>
                </div>
                <div class="kpi kpi-local-favorito">
                    <p>Local que mais costuma pescar:</p>
                    <span id="local_mais_costuma_pescar">Canal de Bertioga</span>
                </div>
                <div class="kpi kpi-modalidade-favorita"></div>
            </div>
            <div class="box-grafico"></div>
            <div class="box-historico-registro"></div>
        </div>
    </div>
</body>

<script>
    fetch("/dadosFormulario/listar") 
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi1 = dados[0]

            document.getElementById("local_mais_costuma_pescar").innerText = kpi1.lugar;
        });
    
    fetch("/dadosFormulario/listarMaiorPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (dados) {
            var kpi2 = dados[0]

            document.getElementById("qtd_peixe").innerText = kpi2.qtd_peixe
        })
</script>

</html>
