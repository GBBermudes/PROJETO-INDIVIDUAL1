<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formulario.css">
    <title>Diário de Pesca do Gabriel | formulario</title>
</head>

<body>
    <div class="box-pai">
        <div class="navbar">
            <div class="hanken titulo-navbar">
                <h1>Diário de Samuela</h3>
            </div>
            <div class="hanken menu-navbar">
                <span class="bt-registrar">Registrar</span>
                <a href="dashboard.html">
                    <span class="bt-dashboard">Dashboard</span>
                </a>
                <span class="bt-sair">Sair</span>
            </div>
        </div>

        <div class="box-formulario">
            <div class="formulario">
                <h1 class="young-serif-regular">Registrar pescaria no diário</h2>
                    <p>Data:</p><br>
                    <input type="date" id="ipt_data">
                    <p>Local:</p> <button class="bt-novo-local" onclick="cadastrarLocalPesca()">Novo Local</button><br>
                    <select name="selecione-local" id="selecione_local">
                        <option value="">Selecione o local</option>
                    </select>
                    <p>Modalidade:</p> <button class="bt-nova-modalidade" onclick="cadastrarModalidadePesca()">Nova Modalidade</button> <br>
                    <select name="selecione-modalidade" id="selecione_modalidade">
                        <option value="">Selecione a modalidade</option>
                    </select>
                    <p>Quantidade de peixes:</p><br>
                    <input type="text" id="ipt_qtd_peixes">
                    <p>Nota da pescaria (1 a 5):</p><br>
                    <select name="nota-pescaria" id="ipt_nota">
                        <option value="" disabled selected>Selecione a nota</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select><br>
                    <div class="botao-formulario">
                        <button onclick="cadastrar()">Registrar</button>
                    </div>
            </div>
        </div>

    </div>
</body>

<script>
    function cadastrarLocalPesca() {
        var nome_local_pesca = prompt("Insira o novo local")

        alert("Registro realizado com sucesso!")
        fetch("/dadosFormulario/cadastrarLocalPesca", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nome_local_pesca: nome_local_pesca
            }),
        });
        location.reload()
    };

    function cadastrarModalidadePesca() {
        var nome_modalidade_pesca = prompt("Insira a nova modalidade: ")

        alert("Registro realizado com sucesso!")
        fetch("/dadosFormulario/cadastrarModalidadePesca", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nome_modalidade_pesca: nome_modalidade_pesca
            }),
        });
        location.reload()
    };



    function cadastrar() {
        var data = ipt_data.value;
        var local = selecione_local.value;
        var modalidade = selecione_modalidade.value;
        var qtd_peixes = Number(ipt_qtd_peixes.value);
        var nota = Number(ipt_nota.value);

        if (data == "" || local == "" || modalidade == "" || qtd_peixes === "" || nota == "") {
            alert("Todas as opções devem estar selecionadas")
        } else if (qtd_peixes < 0) {
            alert("Insira uma quantidade de peixes validos")
        } else {
            alert("Registro realizado com sucesso!")
            fetch("/dadosFormulario/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    data: data,
                    local: local,
                    modalidade: modalidade,
                    qtd_peixes: qtd_peixes,
                    nota: nota
                }),
            })
        }
    }

    fetch("/dadosFormulario/listarLocalPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (locais) {
            var select = document.getElementById("selecione_local");

            locais.forEach(function (local) {
                var opcao = document.createElement("option");
                opcao.value = local.id;
                opcao.textContent = local.nome;
                select.appendChild(opcao);
            });
        })
        .catch(function (erro) {
            console.log("Erro:", erro);
        });

    fetch("/dadosFormulario/listarModalidadesPesca")
        .then(function (resposta) {
            return resposta.json();
        })
        .then(function (modalidades) {
            var select = document.getElementById("selecione_modalidade");

            modalidades.forEach(function (modalidade) {
                var opcao = document.createElement("option");
                opcao.value = modalidade.id;
                opcao.textContent = modalidade.nome;
                select.appendChild(opcao);
            });
        })
        .catch(function (erro) {
            console.log("Erro:", erro);
        });
</script>

</html>
