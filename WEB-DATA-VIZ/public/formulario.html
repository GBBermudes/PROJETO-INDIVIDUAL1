<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formulario.css">
    <title>Diário de Pesca do Gabriel | formulario</title>
</head>
    
<body>
    <div class="pai">
        <aside>
            <h3>Diário de Samuela</h3>
            <p>Registrar</p>
            <p>Dashboard</p>
        </aside>
        <div class="formulario">
            <h2>Registrar pescaria</h2>
            <p>Data:</p><br>
            <input type="date" id="ipt_data">
            <p>Local:</p><br>
            <input type="text" id="ipt_local">
            <p>Modalidade:</p><br>
            <input type="text" id="ipt_modalidade">
            <p>Quantidade de peixes:</p><br>
            <input type="text" id="ipt_qtd_peixes">
            <p>Nota da pescaria (1 a 5):</p><br>
            <input type="text" id="ipt_nota">
            <button onclick="registrar()">Registrar</button>
        </div>
    </div>
</body>

<script>
    function registrar() {
        var tipo_pescaria = ipt_tipo_pescaria.value;
        var como_aproveitar = ipt_como_aproveitar.value;
        var oque_mais_procura = ipt_oque_mais_procura.value;
        var frequencia_pescaria = ipt_frequencia.value;
        var frase = ipt_frase.value;

        if (tipo_pescaria == "" || como_aproveitar == "" || oque_mais_procura == "" || frequencia_pescaria == "" || frase == "") {
            alert("Todas as opções devem estar selecionadas")
        } else {
            fetch("/dadosFormulario/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    tipo_pescaria: tipo_pescaria,
                    como_aproveitar: como_aproveitar,
                    oque_mais_procura: oque_mais_procura,
                    frequencia_pescaria: frequencia_pescaria,
                    frase: frase
                }),
            })
        }
    }
</script>

</html>
